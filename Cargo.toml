[workspace]
resolver = "3"
members = [
    "crates/*",
    "."
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0"
syn = { version = "3.0", features = ["full"] }
proc-macro2 = "1.0"
quote = "1.0"
proc-macro-crate = "3"

macros = { path = "crates/macros" }
internal-macros = { path = "crates/internal-macros" }

[package]
name = "command"
version.workspace = true
edition.workspace = true

[dependencies]
macros.workspace = true
internal-macros.workspace = true
thiserror.workspace = true
argv = { version = "0.1.14", optional = true }

[dev-dependencies]
clap = { version = "4", features = ["derive"] }

[[bench]]
name = "dispatch"
harness = true

[[bench]]
name = "suggestions"
harness = true

[[bench]]
name = "suggestions_async"
harness = true
required-features = ["async-suggestions"]

[features]
## Adds ANSI styling to help output. Disabled by default; when enabled, help strings include ANSI escape codes.
ansi = []

## Enables asynchronous argument suggestion providers and asynchronous tree traversal during suggestions.
async-suggestions = []

## Adds support for argv crate, which allows iterating over the command-line arguments via an `Iterator<Item = &'static OsStr>` implementation. This is mainly for convenience, as it allows you to put in `arv::iter()` as the command input, which will convert the OsStr references into str references for you. This will skip the first argument, which is the executable itself.
argv = ["dep:argv"]

[[example]]
name = "basics"
path = "examples/basics.rs"

[[example]]
name = "repl"
path = "examples/repl.rs"

[[example]]
name = "const"
path = "examples/const.rs"

[[test]]
name = "cli_input"
harness = false

[[example]]
name = "context"
path = "examples/advanced.rs"
